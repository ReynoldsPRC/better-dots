<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>better dots</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1B20" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="better dots" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      :root { --bg: #F5F2EC; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1C1B20; } }
      html, body {
        margin: 0; height: 100%; background: var(--bg);
        overflow: hidden; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #game { display: block; width: 100vw; height: 100dvh; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
